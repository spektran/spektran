# Official v0 split: t1-test (CH4 DA) — HITRAN production line data.
# Requires: python scripts/fetch_hitran.py (one-time, needs network)
dataset_id: ch4-t1-test-v0-hitran
instrument_config:
  - configs/instruments/vi-da-easy-01.yaml
  - configs/instruments/vi-da-medium-02.yaml
  - configs/instruments/vi-da-hard-03.yaml
n_records: 1000
master_seed: 101003
gas:
  molecule: CH4
  concentration_ppm: {low: 1.0, high: 1000.0, log_uniform: true}
  path_length_m: 10.0
  matrix_gas: N2
n_points: 2000
line_source: hitran
wavenumber_range_cm1: [6045.0, 6049.0]
