# Multi-gas triple regression: CH4 + CO2 + H2O (combustion exhaust scenario)
# Target: CH4 + CO2 concentrations, H2O is interferent
dataset_id: ch4-co2-h2o-train-v0
instrument_config:
  - configs/instruments/vi-da-easy-01.yaml
  - configs/instruments/vi-da-medium-02.yaml
  - configs/instruments/vi-da-hard-03.yaml
n_records: 5000
master_seed: 401001
gas:
  molecule: CH4
  concentration_ppm: {low: 1.0, high: 1000.0, log_uniform: true}
  path_length_m: 10.0
  matrix_gas: N2
  interferents:
    - molecule: CO2
      concentration_ppm: {low: 100.0, high: 50000.0, log_uniform: true}
    - molecule: H2O
      concentration_ppm: {low: 100.0, high: 20000.0, log_uniform: true}
n_points: 2000
line_source: demo
