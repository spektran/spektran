# High-end laboratory CRDS: ultra-high finesse, low noise
instrument_config_id: vi-crds-lab-35
schema_version: "0.2"
technique: CRDS
held_out: false
description: "High-end lab CRDS: 50 cm cavity, R=99.995%, shot-noise limited, minimal drift."
cavity:
  length_m: 0.50
  mirror_reflectivity: 0.99995
  n_photons_per_ringdown: {dist: loguniform, low: 5.0e+5, high: 5.0e+6}
  mirror_drift_sigma: {dist: loguniform, low: 1.0e-9, high: 1.0e-8}
  mirror_drift_reversion: 0.01
  mode_matching_mean: 0.98
  mode_matching_sigma: {dist: uniform, low: 0.005, high: 0.015}
  baseline_loss_drift_rate: {dist: loguniform, low: 1.0e-10, high: 1.0e-9}
  baseline_temp_sensitivity: {dist: loguniform, low: 1.0e-9, high: 1.0e-8}
  n_transverse_modes: 1
detector:
  noise_sigma_rel: {dist: loguniform, low: 1.0e-5, high: 5.0e-5}
  type: "InGaAs APD (simulated)"
environment:
  temperature_K: 296.0
  pressure_atm: 1.0
  temperature_jitter_K: {dist: uniform, low: 0.0, high: 0.05}
  pressure_jitter_atm: {dist: uniform, low: 0.0, high: 0.001}
