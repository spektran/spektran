# CO DA easy tier: low noise
# Center on CO fundamental band near 2171 cm-1
instrument_config_id: vi-co-da-easy-30
schema_version: "0.2"
technique: TDLAS-DA
held_out: false
description: "DA instrument for CO (easy tier): low noise."
laser:
  center_wavenumber_cm1: 2171.0
  scan_range_cm1: {dist: uniform, low: 1.8, high: 4.5}
  scan_rate_Hz: 100.0
  scan_nonlinearity_poly_cm1:
    - {dist: normal, mean: 0.0, sigma: 0.01}
  linewidth_MHz: {dist: uniform, low: 1.0, high: 10.0}
etalons:
  - free_spectral_range_cm1: {dist: uniform, low: 0.6, high: 1.2}
    amplitude_rel: {dist: loguniform, low: 4.0e-5, high: 1.8e-4}
    phase_rad: {dist: uniform, low: 0.0, high: 6.283185307}
    phase_drift_rad_per_s: {dist: uniform, low: 3.0e-4, high: 3.0e-3}
optics:
  transmittance_drift_rel_per_s: {dist: loguniform, low: 1.0e-6, high: 1.0e-5}
  intensity_ramp_slope_rel: {dist: uniform, low: 0.1, high: 0.4}
  baseline_poly_rel:
    - {dist: normal, mean: 0.0, sigma: 0.01}
detector:
  white_noise_rel: {dist: loguniform, low: 2.5e-5, high: 8.0e-5}
  shot_noise_gain: {dist: loguniform, low: 5.0e-5, high: 2.0e-4}
  adc_bits: 16
environment:
  temperature_K: 296.0
  pressure_atm: 1.0
  temperature_jitter_K: {dist: uniform, low: 0.0, high: 1.0}
  pressure_jitter_atm: {dist: uniform, low: 0.0, high: 0.005}
