# CO2 WMS medium tier: moderate noise, stronger RAM
instrument_config_id: vi-co2-wms-medium-22
schema_version: "0.1"
technique: TDLAS-WMS
held_out: false
description: "Field WMS instrument for CO2: moderate RAM and noise, two etalons."
laser:
  center_wavenumber_cm1: 4978.3
  scan_range_cm1: {dist: uniform, low: 0.7, high: 1.3}
  scan_rate_Hz: 25.0
  ram_amplitude_rel: {dist: uniform, low: 0.12, high: 0.25}
  linewidth_MHz: {dist: uniform, low: 2.0, high: 10.0}
modulation:
  frequency_Hz: 10000.0
  depth_cm1: {dist: uniform, low: 0.03, high: 0.1}
  lockin_phase_error_rad: {dist: normal, mean: 0.0, sigma: 0.05}
  lowpass_cutoff_Hz: 1000.0
  harmonics: [1, 2]
etalons:
  - free_spectral_range_cm1: {dist: uniform, low: 0.6, high: 1.0}
    amplitude_rel: {dist: loguniform, low: 8.0e-5, high: 2.4e-4}
    phase_rad: {dist: uniform, low: 0.0, high: 6.283185307}
    phase_drift_rad_per_s: {dist: uniform, low: 8.0e-4, high: 3.0e-3}
  - free_spectral_range_cm1: {dist: uniform, low: 0.15, high: 0.35}
    amplitude_rel: {dist: loguniform, low: 4.0e-5, high: 1.2e-4}
    phase_rad: {dist: uniform, low: 0.0, high: 6.283185307}
    phase_drift_rad_per_s: {dist: uniform, low: 8.0e-4, high: 3.0e-3}
detector:
  white_noise_rel: {dist: loguniform, low: 7.0e-5, high: 2.0e-4}
  one_over_f_sigma_rel: {dist: loguniform, low: 3.0e-5, high: 1.0e-4}
  one_over_f_slope: {dist: uniform, low: 0.9, high: 1.2}
environment:
  temperature_K: 296.0
  pressure_atm: 1.0
  temperature_jitter_K: {dist: uniform, low: 0.1, high: 0.5}
