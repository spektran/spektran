# HELD-OUT DA instrument: parameter ranges deliberately offset from the
# training instruments (between medium and hard, but with distinct etalon
# FSR bands and nonlinearity signatures). Test-set only (generalization track).
instrument_config_id: vi-da-heldout-07
schema_version: "0.2"
technique: TDLAS-DA
held_out: true
description: "Held-out DA instrument: distinct noise signature with shot noise, speckle, and moderate EMI for generalization testing."
laser:
  center_wavenumber_cm1: 6047.0
  scan_range_cm1: {dist: uniform, low: 1.9, high: 2.1}
  scan_rate_Hz: 100.0
  scan_nonlinearity_poly_cm1:
    - {dist: normal, mean: 0.04, sigma: 0.01}
    - {dist: normal, mean: -0.03, sigma: 0.01}
  linewidth_MHz: {dist: uniform, low: 8.0, high: 15.0}
  mode_hop_probability: {dist: loguniform, low: 2.0e-3, high: 8.0e-3}
  mode_hop_size_cm1: {dist: uniform, low: 0.15, high: 0.35}
etalons:
  - free_spectral_range_cm1: {dist: uniform, low: 0.35, high: 0.55}
    amplitude_rel: {dist: loguniform, low: 9.0e-5, high: 2.2e-4}
    phase_rad: {dist: uniform, low: 0.0, high: 6.283185307}
    phase_drift_rad_per_s: {dist: uniform, low: 1.0e-3, high: 4.0e-3}
  - free_spectral_range_cm1: {dist: uniform, low: 0.04, high: 0.12}
    amplitude_rel: {dist: loguniform, low: 4.5e-5, high: 1.3e-4}
    phase_rad: {dist: uniform, low: 0.0, high: 6.283185307}
    phase_drift_rad_per_s: {dist: uniform, low: 1.0e-3, high: 4.0e-3}
optics:
  transmittance_drift_rel_per_s: {dist: loguniform, low: 1.0e-6, high: 1.0e-5}
  intensity_ramp_slope_rel: {dist: uniform, low: 0.35, high: 0.55}
  baseline_poly_rel:
    - {dist: normal, mean: 0.015, sigma: 0.008}
    - {dist: normal, mean: -0.012, sigma: 0.008}
  beam_wander_sigma_rel: {dist: loguniform, low: 3.0e-5, high: 1.5e-4}
  gas_flow_turbulence_sigma_rel: {dist: loguniform, low: 2.0e-5, high: 1.0e-4}
detector:
  white_noise_rel: {dist: loguniform, low: 9.0e-5, high: 2.4e-4}
  shot_noise_gain: {dist: loguniform, low: 2.0e-4, high: 7.0e-4}
  one_over_f_sigma_rel: {dist: loguniform, low: 4.0e-5, high: 1.4e-4}
  one_over_f_slope: {dist: uniform, low: 1.1, high: 1.5}
  emi_frequencies_Hz: [60.0]
  emi_amplitudes_rel: [{dist: loguniform, low: 2.0e-5, high: 1.0e-4}]
  speckle_noise_sigma: {dist: loguniform, low: 2.0e-5, high: 1.0e-4}
  speckle_correlation_length: {dist: uniform, low: 8, high: 25}
  adc_bits: 13
  clock_jitter_rel: {dist: loguniform, low: 2.0e-6, high: 2.0e-5}
physics:
  h2o_continuum_fraction: {dist: uniform, low: 0.005, high: 0.02}
environment:
  temperature_K: 296.0
  pressure_atm: 1.0
  temperature_jitter_K: {dist: uniform, low: 0.3, high: 1.0}
  pressure_jitter_atm: {dist: uniform, low: 0.003, high: 0.01}
