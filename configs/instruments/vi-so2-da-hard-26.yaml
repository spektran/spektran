# SO2 DA hard tier: harsh env
# Center on SO2 ν1+ν3 combination band near 2500 cm-1
instrument_config_id: vi-so2-da-hard-26
schema_version: "0.2"
technique: TDLAS-DA
held_out: false
description: "DA instrument for SO2 (hard tier): harsh env."
laser:
  center_wavenumber_cm1: 2500.6
  scan_range_cm1: {dist: uniform, low: 1.8, high: 2.2}
  scan_rate_Hz: 100.0
  scan_nonlinearity_poly_cm1:
    - {dist: normal, mean: 0.0, sigma: 0.06}
  linewidth_MHz: {dist: uniform, low: 1.0, high: 10.0}
etalons:
  - free_spectral_range_cm1: {dist: uniform, low: 0.6, high: 1.0}
    amplitude_rel: {dist: loguniform, low: 4.0e-5, high: 1.8e-4}
    phase_rad: {dist: uniform, low: 0.0, high: 6.283185307}
    phase_drift_rad_per_s: {dist: uniform, low: 3.0e-4, high: 3.0e-3}
optics:
  transmittance_drift_rel_per_s: {dist: loguniform, low: 1.0e-6, high: 1.0e-5}
  intensity_ramp_slope_rel: {dist: uniform, low: 0.1, high: 0.4}
  baseline_poly_rel:
    - {dist: normal, mean: 0.0, sigma: 0.01}
detector:
  white_noise_rel: {dist: loguniform, low: 1.4e-4, high: 3.2e-4}
  shot_noise_gain: {dist: loguniform, low: 2.0e-4, high: 8.0e-4}
  adc_bits: 12
  emi_frequencies_Hz: [50.0]
  emi_amplitudes_rel: [{dist: loguniform, low: 2.0e-5, high: 1.0e-4}]
environment:
  temperature_K: 296.0
  pressure_atm: 1.0
  temperature_jitter_K: {dist: uniform, low: 0.0, high: 1.0}
  pressure_jitter_atm: {dist: uniform, low: 0.0, high: 0.005}
