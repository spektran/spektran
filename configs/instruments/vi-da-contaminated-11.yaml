# Medium tier with window contamination and beam wander effects
instrument_config_id: vi-da-contaminated-11
schema_version: "0.2"
technique: TDLAS-DA
held_out: false
description: "Field DA instrument with window contamination and beam wander."
laser:
  center_wavenumber_cm1: 6047.0
  scan_range_cm1: {dist: uniform, low: 1.7, high: 2.3}
  scan_rate_Hz: 100.0
  scan_nonlinearity_poly_cm1:
    - {dist: normal, mean: 0.0, sigma: 0.03}
    - {dist: normal, mean: 0.0, sigma: 0.02}
  linewidth_MHz: {dist: uniform, low: 2.0, high: 10.0}
etalons:
  - free_spectral_range_cm1: {dist: uniform, low: 0.6, high: 1.0}
    amplitude_rel: {dist: loguniform, low: 8.0e-5, high: 2.4e-4}
    phase_rad: {dist: uniform, low: 0.0, high: 6.283185307}
    phase_drift_rad_per_s: {dist: uniform, low: 8.0e-4, high: 3.0e-3}
optics:
  transmittance_drift_rel_per_s: {dist: loguniform, low: 1.0e-6, high: 1.0e-5}
  intensity_ramp_slope_rel: {dist: uniform, low: 0.15, high: 0.4}
  intensity_ramp_curvature_rel: {dist: normal, mean: 0.0, sigma: 0.05}
  baseline_poly_rel:
    - {dist: normal, mean: 0.0, sigma: 0.01}
  window_contamination_rel: {dist: loguniform, low: 0.01, high: 0.10}
  window_spectral_slope: {dist: uniform, low: 0.5, high: 2.0}
  beam_wander_sigma_rel: {dist: loguniform, low: 1.0e-4, high: 5.0e-3}
  beam_wander_cutoff_norm: {dist: uniform, low: 0.02, high: 0.08}
detector:
  white_noise_rel: {dist: loguniform, low: 7.0e-5, high: 2.0e-4}
  shot_noise_gain: {dist: loguniform, low: 1.0e-4, high: 5.0e-4}
  one_over_f_sigma_rel: {dist: loguniform, low: 3.0e-5, high: 1.0e-4}
  one_over_f_slope: {dist: uniform, low: 0.9, high: 1.2}
  adc_bits: 14
environment:
  temperature_K: 296.0
  pressure_atm: 1.0
  temperature_jitter_K: {dist: uniform, low: 0.1, high: 0.5}
  pressure_jitter_atm: {dist: uniform, low: 0.001, high: 0.005}
