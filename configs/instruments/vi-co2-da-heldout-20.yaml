# CO2 HELD-OUT DA instrument: parameter ranges deliberately offset from the
# training instruments. Test-set only (generalization track).
instrument_config_id: vi-co2-da-heldout-20
schema_version: "0.2"
technique: TDLAS-DA
held_out: true
description: "Held-out DA instrument for CO2 cross-instrument generalization track."
laser:
  center_wavenumber_cm1: 4978.3
  scan_range_cm1: {dist: uniform, low: 1.9, high: 2.1}
  scan_rate_Hz: 100.0
  scan_nonlinearity_poly_cm1:
    - {dist: normal, mean: 0.04, sigma: 0.01}
    - {dist: normal, mean: -0.03, sigma: 0.01}
  linewidth_MHz: {dist: uniform, low: 8.0, high: 15.0}
etalons:
  - free_spectral_range_cm1: {dist: uniform, low: 0.35, high: 0.55}
    amplitude_rel: {dist: loguniform, low: 9.0e-5, high: 2.2e-4}
    phase_rad: {dist: uniform, low: 0.0, high: 6.283185307}
    phase_drift_rad_per_s: {dist: uniform, low: 1.0e-3, high: 4.0e-3}
  - free_spectral_range_cm1: {dist: uniform, low: 0.04, high: 0.12}
    amplitude_rel: {dist: loguniform, low: 4.5e-5, high: 1.3e-4}
    phase_rad: {dist: uniform, low: 0.0, high: 6.283185307}
    phase_drift_rad_per_s: {dist: uniform, low: 1.0e-3, high: 4.0e-3}
optics:
  transmittance_drift_rel_per_s: {dist: loguniform, low: 1.0e-6, high: 1.0e-5}
  intensity_ramp_slope_rel: {dist: uniform, low: 0.35, high: 0.55}
  baseline_poly_rel:
    - {dist: normal, mean: 0.015, sigma: 0.008}
    - {dist: normal, mean: -0.012, sigma: 0.008}
detector:
  white_noise_rel: {dist: loguniform, low: 9.0e-5, high: 2.4e-4}
  shot_noise_gain: {dist: loguniform, low: 2.0e-4, high: 8.0e-4}
  one_over_f_sigma_rel: {dist: loguniform, low: 4.0e-5, high: 1.4e-4}
  one_over_f_slope: {dist: uniform, low: 1.1, high: 1.5}
  adc_bits: 13
  emi_frequencies_Hz: [50.0]
  emi_amplitudes_rel: [{dist: loguniform, low: 2.0e-5, high: 1.0e-4}]
environment:
  temperature_K: 296.0
  pressure_atm: 1.0
  temperature_jitter_K: {dist: uniform, low: 0.3, high: 1.0}
  pressure_jitter_atm: {dist: uniform, low: 0.003, high: 0.01}
