# Long-path DOAS: active source, horizontal path, industrial monitoring
instrument_config_id: vi-doas-lp-45
schema_version: "0.2"
technique: DOAS
held_out: false
description: "Active long-path DOAS: Xe arc lamp, 100-1000m path, industrial fence-line."
spectrograph:
  mie_tau_ref: {dist: uniform, low: 0.02, high: 0.2}
  mie_angstrom_exp: {dist: uniform, low: 0.5, high: 1.5}
  stray_light_fraction: {dist: loguniform, low: 1.0e-4, high: 1.0e-3}
  ring_effect_amplitude: 0.0
  wavelength_shift_nm: {dist: loguniform, low: 0.01, high: 0.03}
detector:
  photon_count_ref: {dist: loguniform, low: 1.0e+6, high: 1.0e+7}
  dark_current_sigma: {dist: loguniform, low: 1.0e-6, high: 1.0e-5}
  readout_noise_sigma: {dist: loguniform, low: 1.0e-5, high: 5.0e-5}
  type: "photodiode (simulated)"
environment:
  temperature_K: {dist: uniform, low: 273.0, high: 313.0}
  pressure_atm: {dist: uniform, low: 0.95, high: 1.05}
  temperature_jitter_K: {dist: uniform, low: 0.5, high: 2.0}
  pressure_jitter_atm: {dist: uniform, low: 0.001, high: 0.01}
