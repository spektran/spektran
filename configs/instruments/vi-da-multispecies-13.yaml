# Multi-species instrument: CH4 + H2O overlap in the 2nu3 region
# H2O has weak but non-negligible lines near 6046-6048 cm-1
instrument_config_id: vi-da-multispecies-13
schema_version: "0.1"
technique: TDLAS-DA
held_out: false
description: "Multi-species DA instrument: CH4 + H2O interference, medium noise."
laser:
  center_wavenumber_cm1: 6047.0
  scan_range_cm1: {dist: uniform, low: 1.8, high: 2.2}
  scan_rate_Hz: 100.0
  scan_nonlinearity_poly_cm1:
    - {dist: normal, mean: 0.0, sigma: 0.02}
    - {dist: normal, mean: 0.0, sigma: 0.01}
  linewidth_MHz: {dist: uniform, low: 2.0, high: 8.0}
etalons:
  - free_spectral_range_cm1: {dist: uniform, low: 0.6, high: 1.0}
    amplitude_rel: {dist: loguniform, low: 5.0e-5, high: 2.0e-4}
    phase_rad: {dist: uniform, low: 0.0, high: 6.283185307}
    phase_drift_rad_per_s: {dist: uniform, low: 5.0e-4, high: 2.0e-3}
optics:
  transmittance_drift_rel_per_s: {dist: loguniform, low: 1.0e-6, high: 5.0e-6}
  intensity_ramp_slope_rel: {dist: uniform, low: 0.1, high: 0.3}
  intensity_ramp_curvature_rel: {dist: normal, mean: 0.0, sigma: 0.03}
  baseline_poly_rel:
    - {dist: normal, mean: 0.0, sigma: 0.008}
    - {dist: normal, mean: 0.0, sigma: 0.005}
detector:
  white_noise_rel: {dist: loguniform, low: 5.0e-5, high: 1.5e-4}
  one_over_f_sigma_rel: {dist: loguniform, low: 2.0e-5, high: 8.0e-5}
  one_over_f_slope: {dist: uniform, low: 0.9, high: 1.1}
  adc_bits: 14
environment:
  temperature_K: 296.0
  pressure_atm: 1.0
  temperature_jitter_K: {dist: uniform, low: 0.1, high: 0.3}
  pressure_jitter_atm: {dist: uniform, low: 0.001, high: 0.003}
