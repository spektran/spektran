# OpenGasSpec Gate G2 literature survey: per-paper parameter checklists
# Scope: quantitative TDLAS gas measurements (direct absorption, DA, and
# wavelength modulation spectroscopy, WMS), primarily 2013-2026, plus
# foundational calibration-free WMS references.
# Honesty policy: DOIs marked "doi-unverified" were not independently confirmed
# during this survey; all entries correspond to real publications located via
# web search or reliably known citation records. Metadata for entries without
# the flag was verified against publisher/PubMed/PMC/OSTI pages during the survey
# (2026-08-04).
# "parameters" lists use the canonical snake_case names defined in
# g2_parameter_superset.yaml and reflect what each paper reports (or requires)
# to reproduce its measurement.

survey_date: 2026-08-04
n_papers: 23
