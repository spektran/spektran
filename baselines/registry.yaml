# Baseline registry — maps short names to training scripts and metadata.
# Used by `spektran list baselines`, `spektran train`, and `spektran status`.

baselines:
  ridge:
    display_name: Ridge Regression
    description: "StandardScaler + L2-regularized linear regression (~201 params)"
    directory: ridge_regression
    tasks:
      T1:
        script: train.py
        datasets: [ch4-t1-train-v0, ch4-t1-val-v0, ch4-t1-test-v0, ch4-t3-test-heldout-v0]
        predictions:
          T1: predictions_t1-test.csv
          T3: predictions_t3-test-heldout.csv
        scores:
          T1: scores_t1.json
          T3: scores_t3.json

  cnn1d:
    display_name: 1D CNN
    description: "3-layer Conv1d + global pool + dense head (~50K params)"
    directory: cnn1d
    tasks:
      T1:
        script: train.py
        datasets: [ch4-t1-train-v0, ch4-t1-val-v0, ch4-t1-test-v0, ch4-t3-test-heldout-v0]
        predictions:
          T1: predictions_t1-test.csv
          T3: predictions_t3-test-heldout.csv
        scores:
          T1: scores_t1.json
          T3: scores_t3.json

  transformer:
    display_name: Patchified Transformer
    description: "Patchified input + 4-layer encoder + regression head (~100K params)"
    directory: transformer_t1
    tasks:
      T1:
        script: train.py
        datasets: [ch4-t1-train-v0, ch4-t1-val-v0, ch4-t1-test-v0, ch4-t3-test-heldout-v0]
        predictions:
          T1: predictions_t1-test.csv
          T3: predictions_t3-test-heldout.csv

  voigt_fit:
    display_name: Voigt Fit (LM)
    description: "Classical Levenberg-Marquardt Voigt profile fit — no training, pure physics retrieval"
    directory: voigt_fit_t1
    tasks:
      T1:
        script: train.py
        datasets: [ch4-t1-test-v0, ch4-t3-test-heldout-v0]
        predictions:
          T1: predictions_t1-test.csv
          T3: predictions_t3-test-heldout.csv

  wing_poly:
    display_name: Wing-Anchored Polynomial
