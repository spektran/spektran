        scores:
          T2: scores_t2.json

  unet:
    display_name: 1D U-Net
    description: "Encoder-decoder with skip connections for spectral denoising"
    directory: unet_t2
    tasks:
      T2:
        script: train.py
        datasets: [ch4-t1-train-v0, ch4-t1-val-v0, ch4-t1-test-v0]
        predictions:
          T2: predictions_t2.h5
        scores:
          T2: scores_t2.json

  ridge_wms:
    display_name: Ridge (WMS)
    description: "Ridge regression on 2f demodulated WMS signal"
    directory: ridge_wms_t4
    tasks:
      T4:
        script: train.py
        datasets: [ch4-t4-train-v0, ch4-t4-val-v0, ch4-t4-test-v0]
